<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Project Patchwork</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ctext y='26' font-size='26'%3E%F0%9F%92%80%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --ground:#0F1009; --panel:#171A11; --panel-2:#1E2217; --sunken:#0A0B06;
  --ink:#E8E4D5; --ink-soft:#C3BEAA; --muted:#8B866E;
  --line:#2C3124; --line-soft:#222618;
  --accent:#A6C46C; --accent-dim:#6E8A42; --accent-bg:#1E2616;
  --danger:#D4825A; --danger-bg:#2B1A12;
  --gold:#D6B65C;
  --rare:#7FB6D8;        /* 희귀 부속 — 차가운 푸른빛 */
  --el-참격:#C9CDD4; --el-타격:#C79A6B; --el-화염:#E0794A; --el-냉기:#7FB6D8;
  --el-독:#9FBF5A; --el-부패:#8A9B57; --el-신성:#E6D99B;
  --display:"Gowun Batang","Nanum Myeongjo",Georgia,serif;
  --body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
*{box-sizing:border-box}
html,body{height:100%}
/*
 * rem의 기준을 뷰포트에 고정한다.
 * 이걸 안 하면 모바일 브라우저의 글꼴 크기 설정에 화면 전체가 끌려간다.
 * text-size-adjust는 안드로이드 크롬의 자동 글자 확대(text boosting)를 막는다.
 */
html{
  font-size:calc(clamp(12px, 2.6vmin, 16px) * var(--ui-scale, 1));
  -webkit-text-size-adjust:100%;
  text-size-adjust:100%;
}
body{
  margin:0;background:var(--ground);color:var(--ink);
  font-family:var(--body);font-weight:350;font-size:1rem;line-height:1.55;
  -webkit-font-smoothing:antialiased;overflow:hidden;
  overscroll-behavior:none;
}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* ── 전체 틀 ─────────────────────────────── */
#app{
  height:100dvh;display:grid;
  grid-template-rows:auto minmax(0,1fr) auto;   /* 상단바 · 본문 · 선택지 */
  max-width:1400px;margin:0 auto;
}
/*
 * 넓으면 한 줄, 좁거나 글자가 커지면 재화가 통째로 다음 줄로 내려간다.
 * nowrap + overflow-x로 두면 글자를 키웠을 때 잘린 것처럼 보인다.
 */
#topbar{
  display:flex;flex-wrap:wrap;gap:.15rem .9rem;align-items:baseline;
  padding:.4rem clamp(8px,1.6vw,18px);
  border-bottom:1px solid var(--line);background:var(--panel);
  font-family:var(--mono);font-size:.74rem;color:var(--muted);
  min-width:0;
}
#topbar .where{flex:1 1 auto;min-width:0;overflow-wrap:anywhere}
#topbar .res{
  display:flex;flex-wrap:wrap;gap:.15rem .9rem;align-items:baseline;min-width:0;
}
#topbar .res span{flex:0 0 auto;white-space:nowrap}
/* 넓은 화면에서는 위치 · 재화 · 버튼이 한 줄에 나란히 */
@media (min-width:660px){
  #topbar .res{flex:1 1 auto;justify-content:flex-end;order:1}
  #uiscale{order:2}
  #uisound{order:3}
}
/* 좁은 화면에서는 재화가 둘째 줄로 내려간다 */
@media (max-width:659px){
  #topbar .res{flex:1 0 100%;order:2}
  #uiscale{order:1;margin-left:auto}
  #uisound{order:1}
}
#uiscale,#uisound{
  flex:0 0 auto;font-family:var(--mono);font-size:.74rem;color:var(--muted);
  border:1px solid var(--line);border-radius:2px;padding:.1rem .4rem;margin-left:.2rem;
  -webkit-tap-highlight-color:transparent;touch-action:manipulation;
}
#uiscale:hover,#uisound:hover{color:var(--ink);border-color:var(--accent-dim)}
#uisound{min-width:1.6rem}
#uisound.off{opacity:.45}

/* 글자 크기 조절바 */
/* ID 선택자가 브라우저 기본 [hidden] 규칙을 이기므로 직접 눌러 준다 */
#scalebox[hidden]{display:none}
#scalebox{
  position:fixed;z-index:20;right:clamp(8px,2vw,20px);top:2.6rem;
  background:var(--panel);border:1px solid var(--accent-dim);border-radius:3px;
  padding:.7rem .8rem;display:grid;gap:.5rem;min-width:min(17rem,calc(100vw - 24px));
  box-shadow:0 6px 24px rgba(0,0,0,.5);
}
#scalebox .row1{display:flex;align-items:baseline;justify-content:space-between;gap:.6rem}
#scalebox .ttl{font-family:var(--mono);font-size:.72rem;letter-spacing:.1em;
  text-transform:uppercase;color:var(--muted)}
#scaleval{font-family:var(--mono);font-size:.85rem;color:var(--accent)}
#scalerange{
  -webkit-appearance:none;appearance:none;width:100%;height:1.6rem;background:none;
  touch-action:manipulation;
}
#scalerange::-webkit-slider-runnable-track{height:4px;background:var(--line);border-radius:2px}
#scalerange::-moz-range-track{height:4px;background:var(--line);border-radius:2px}
#scalerange::-webkit-slider-thumb{
  -webkit-appearance:none;appearance:none;width:1.25rem;height:1.25rem;margin-top:-.53rem;
  background:var(--accent);border:0;border-radius:50%;cursor:pointer;
}
#scalerange::-moz-range-thumb{
  width:1.25rem;height:1.25rem;background:var(--accent);border:0;border-radius:50%;cursor:pointer;
}
#scalebox .acts{display:flex;gap:.4rem}
#scalebox button{
  flex:1;font-family:var(--mono);font-size:.74rem;color:var(--muted);
  border:1px solid var(--line);border-radius:2px;padding:.3rem;
  -webkit-tap-highlight-color:transparent;touch-action:manipulation;
}
#scalebox button:hover{color:var(--ink);border-color:var(--accent-dim)}
#scalebox .preview{font-size:.95rem;color:var(--ink-soft);border-top:1px solid var(--line-soft);padding-top:.45rem}
#topbar .where{color:var(--accent);letter-spacing:.06em}
#topbar b{color:var(--ink-soft);font-weight:500}

#panes{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);min-height:0}

#panetoggle{display:none}

/*
 * 세로 비율이거나 너무 좁으면 위아래로 쌓는다 (§12.2).
 * 글자를 키우면 상태 패널과 선택지가 함께 커져 로그가 짜부라진다.
 * 그래서 ① 상태 패널을 접을 수 있게 하고 ② 로그에 최소 높이를 보장한다.
 */
@media (max-aspect-ratio:4/5), (max-width:560px){
  #panes{grid-template-columns:1fr;grid-template-rows:minmax(0,auto) auto minmax(22dvh,1fr)}
  #app #left{max-height:30dvh;border-right:0;border-bottom:1px solid var(--line)}
  /* 기본 규칙이 파일 뒤쪽에 있어 명시도를 한 단계 올려야 이긴다 */
  #app #choices{max-height:30dvh;gap:.3rem}
  /* 세로에서는 줄 간격을 좁혀 같은 높이에 더 많은 줄을 담는다 */
  #app #log{gap:.12rem;padding-block:.5rem}
  #app #log .line{line-height:1.42}
  #app #log .line.narrate{margin:.25rem 0}
  #app #log .line.head{margin-top:.6rem;padding-top:.35rem}

  #panetoggle{
    display:block;width:100%;text-align:center;
    font-family:var(--mono);font-size:.7rem;letter-spacing:.08em;color:var(--muted);
    background:var(--panel);border-bottom:1px solid var(--line);
    padding:.3rem;
    -webkit-tap-highlight-color:transparent;touch-action:manipulation;
  }
  #panetoggle:hover{color:var(--ink)}
  /* 접으면 로그가 그만큼 넓어진다 */
  #app.panes-collapsed #left{
    max-height:0 !important;padding-block:0;border-bottom:0;overflow:hidden;
  }
}

/* 가로모드 휴대폰 — 높이가 모자라므로 세로 여백을 걷어낸다 */
@media (orientation:landscape) and (max-height:520px){
  #topbar{padding-block:.25rem}
  #left,#log{padding-block:.5rem}
  #choices{max-height:52dvh;padding:.4rem clamp(6px,1.2vw,12px);gap:.3rem}
  .btn{padding:.34rem .55rem}
  .line{line-height:1.45}
  .unit{margin-bottom:.7rem}
  hr.sep{margin:.6rem 0}
  section,.map{margin-block:.3rem}
}

#left{
  border-right:1px solid var(--line);overflow-y:auto;
  padding:clamp(10px,2vw,18px);background:var(--panel);
}
#right{display:grid;min-height:0}
/* 오른쪽은 순수 텍스트 영역 — 로그만 있다 */
#log{
  overflow-y:auto;padding:clamp(10px,2vw,18px);
  display:flex;flex-direction:column;gap:.24rem;
}
#choices{
  border-top:1px solid var(--line);background:var(--panel);
  padding:clamp(6px,1.4vw,14px);
  padding-bottom:max(clamp(6px,1.4vw,14px), env(safe-area-inset-bottom));
  display:flex;flex-wrap:wrap;gap:.4rem;align-content:flex-start;
  max-height:46dvh;overflow-y:auto;
}

/* ── 로그 ────────────────────────────────── */
.line{animation:fade .28s ease both}
@keyframes fade{from{opacity:0;transform:translateY(3px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.line{animation:none}}
.line.golem{color:var(--ink)}
.line.enemy{color:var(--ink-soft)}
.line.good{color:var(--accent)}
.line.bad{color:var(--danger)}
.line.necro{color:var(--gold)}
.line.dim{color:var(--muted)}
.line.narrate{color:var(--ink-soft);font-family:var(--display);font-size:1.02rem;margin:.4rem 0}
.line.head{
  font-family:var(--mono);font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;
  color:var(--accent);margin-top:1rem;padding-top:.5rem;border-top:1px solid var(--line-soft);
}
.line::before{content:"› ";color:var(--muted)}
.line.narrate::before,.line.head::before{content:""}

/* ── 전투 연출 (§5.8) ─────────────────────
   로그가 한 줄씩 떨어지면서, 타격이 들어간 줄에서 화면이 짧게 흔들린다. */
.line{animation:line-in .16s ease-out}
.line.big{font-weight:600;letter-spacing:.01em;animation:line-in .16s ease-out,line-pop .28s ease-out}
@keyframes line-in{from{opacity:0;transform:translateY(.25rem)}to{opacity:1;transform:none}}
@keyframes line-pop{0%{transform:scale(1)}35%{transform:scale(1.045)}100%{transform:scale(1)}}

/* 적이 맞으면 가볍게, 내 골렘이 맞으면 크게 — 누가 맞았는지 손끝으로 구분된다 */
#app.hit-mon{animation:shake-soft .22s ease-in-out}
#app.hit-golem{animation:shake-hard .34s ease-in-out}
@keyframes shake-soft{0%,100%{transform:translateX(0)}30%{transform:translateX(-3px)}70%{transform:translateX(3px)}}
@keyframes shake-hard{
  0%,100%{transform:translate(0,0)}
  15%{transform:translate(-6px,2px)}
  35%{transform:translate(5px,-2px)}
  55%{transform:translate(-4px,-1px)}
  80%{transform:translate(3px,1px)}
}
#app.hit-golem::after{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:5;
  background:var(--danger);opacity:.08;animation:flash .34s ease-out forwards;
}
@keyframes flash{to{opacity:0}}

/* 연출이 도는 동안 선택지 자리를 지키는 표시 — 버튼이 사라졌다 나타나며 화면이 튀지 않게 한다 */
.waiting{
  font-family:var(--mono);font-size:.72rem;letter-spacing:.14em;color:var(--muted);
  display:flex;align-items:center;justify-content:center;min-height:2.2rem;
  animation:breathe 1.1s ease-in-out infinite;
}
@keyframes breathe{0%,100%{opacity:.45}50%{opacity:.9}}

@media (prefers-reduced-motion:reduce){
  .line,.line.big,#app.hit-mon,#app.hit-golem,.waiting{animation:none}
  #app.hit-golem::after{display:none}
}

/* 체력·방어도 바 — 줄어드는 게 눈에 보여야 로그의 박자가 산다 */
.bar > i{transition:width .38s cubic-bezier(.2,.8,.2,1)}
.bar{position:relative;overflow:hidden}
/* 방금 깎인 만큼이 잠깐 남았다가 따라 내려간다 */
.bar > u{
  position:absolute;top:0;bottom:0;display:block;background:var(--danger);opacity:.5;
  transition:width .5s ease-out .12s,opacity .5s ease-out .12s;
}
@media (prefers-reduced-motion:reduce){
  .bar > i,.bar > u{transition:none}
}

/* 속성 상성표 */
.aftable{overflow-x:auto;margin:.3rem 0 .5rem}
.aftable table{border-collapse:collapse;font-size:.68rem;font-family:var(--mono)}
.aftable th,.aftable td{border:1px solid var(--line-soft);padding:.22rem .3rem;text-align:center;white-space:nowrap}
.aftable th{color:var(--muted);font-weight:400}
.aftable th.afc{font-size:.6rem}
.aftable .af1{color:var(--line)}
.aftable .afup{color:var(--accent)}
.aftable .afdown{color:var(--danger)}
.aftable .afzero{color:var(--danger);font-weight:700}

/* 방어도 도식 — 여섯 줄 목록 대신 사람 모양으로 세워 놓고 숫자만 보여 준다 */
.bodymap{
  display:grid;gap:.2rem;margin:.1rem 0 .35rem;
  grid-template-columns:1fr 1fr 1fr;
  grid-template-areas:
    ".    head  ."
    "armL body  armR"
    "legL .     legR";
}
.bcell{
  position:relative;overflow:hidden;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.1rem;
  min-height:2.05rem;padding:.15rem .2rem;
  background:var(--sunken);border:1px solid var(--line);border-radius:3px;
  -webkit-tap-highlight-color:transparent;touch-action:manipulation;
}
/* 남은 방어도를 칸 안쪽에 채워 보여 준다 — 숫자를 안 읽어도 한눈에 들어온다 */
.bcell .bfill{
  position:absolute;left:0;right:0;bottom:0;z-index:0;
  background:var(--accent);opacity:.16;transition:height .35s ease-out;
}
.bcell .bl{position:relative;z-index:1;font-family:var(--mono);font-size:.58rem;color:var(--muted);letter-spacing:.03em;line-height:1}
.bcell .bv{position:relative;z-index:1;font-family:var(--mono);font-size:.78rem;color:var(--ink);line-height:1.1}
.bcell.mid .bfill{background:var(--gold)}
.bcell.mid .bv{color:var(--gold)}
.bcell.low .bfill{background:var(--danger)}
.bcell.low .bv{color:var(--danger)}
.bcell.down{border-color:var(--danger);opacity:.55}
.bcell.down .bv{color:var(--danger)}
.bcell.empty{border-style:dashed;opacity:.4}
.bcell.picked{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent-dim)}
.bcell:hover:not(.empty){border-color:var(--accent-dim)}

.bodydetail{
  min-height:1.6rem;font-size:.8rem;line-height:1.5;
  border-top:1px solid var(--line-soft);padding-top:.35rem;
}
.bodydetail .hint{color:var(--muted);font-size:.74rem}
.bd-top{display:flex;gap:.35rem;align-items:center;flex-wrap:wrap;margin-bottom:.15rem}
.bd-row{display:flex;gap:.7rem;flex-wrap:wrap;color:var(--ink-soft);font-size:.76rem}
.bd-row b{color:var(--ink)} .bd-row b.warn{color:var(--danger)}
.bd-down{color:var(--danger);font-size:.74rem;margin-top:.1rem}
.pt .sub{font-family:var(--mono);font-size:.72rem;color:var(--muted);font-weight:400;margin-left:.3rem}

/* 부속 등급 색 — 일반은 평범하게, 희귀는 푸르게, 유니크는 금빛으로 */
.rar.common{color:inherit}
.rar.rare{color:var(--rare)}
.rar.unique{color:var(--gold)}
.rar.unique{font-weight:600}

/* 이동 십자키 — 던전에서만 뜬다. 화면 오른쪽 아래에 붙박이로 둔다 */
#dpad[hidden]{display:none}
#dpad{
  position:fixed;z-index:15;
  --dp:2.1rem;
  right:calc(clamp(8px,2vw,18px) + env(safe-area-inset-right,0px));
  bottom:calc(clamp(8px,2vw,18px) + env(safe-area-inset-bottom,0px));
  display:grid;grid-template-columns:repeat(3,var(--dp));grid-template-rows:repeat(3,var(--dp));
  gap:.15rem;
}
#dpad .dp{
  font-family:var(--mono);font-size:1rem;line-height:1;
  color:var(--ink-soft);background:var(--panel);border:1px solid var(--line);border-radius:3px;
  display:flex;align-items:center;justify-content:center;
  -webkit-tap-highlight-color:transparent;touch-action:manipulation;
}
/* 아직 안 가 본 방향은 눈에 띄게 — 선택지에서 뺀 '미탐험' 표시를 대신한다 */
#dpad .dp[data-seen="false"]{color:var(--accent);border-color:var(--accent-dim)}
#dpad .dp:hover:not(:disabled){color:var(--ink);border-color:var(--accent)}
#dpad .dp:active:not(:disabled){background:var(--panel-2)}
#dpad .dp:disabled{opacity:.2}
#dpad .up{grid-area:1/2} #dpad .left{grid-area:2/1}
#dpad .right{grid-area:2/3} #dpad .down{grid-area:3/2}

/* 십자키가 선택지를 덮지 않게 그만큼 자리를 비워 둔다.
   덮으면 마지막 선택지(상성표 같은 것)를 아예 누를 수 없다. */
#app.dpad-on #choices{
  padding-right:calc(var(--dp-w) + clamp(8px,2vw,18px) * 2 + env(safe-area-inset-right,0px));
}
#app{--dp-w:calc(2.1rem * 3 + .3rem)}

/* 좁은 화면에서는 조금 작게 */
@media (max-aspect-ratio:4/5), (max-width:560px){
  #dpad{--dp:1.9rem}
  #app{--dp-w:calc(1.9rem * 3 + .3rem)}
}

/* 글상자 — 세이브 내보내기·가져오기 */
.textbox{display:flex;flex-direction:column;gap:.4rem;width:100%}
.tb-title{font-family:var(--mono);font-size:.72rem;letter-spacing:.1em;color:var(--muted);margin:0}
.textbox textarea{
  width:100%;box-sizing:border-box;min-height:7rem;max-height:30dvh;resize:vertical;
  font-family:var(--mono);font-size:.72rem;line-height:1.5;
  color:var(--ink);background:var(--panel-2);border:1px solid var(--line);border-radius:2px;padding:.5rem;
}
.tb-row{display:flex;gap:.4rem}
.tb-row .btn{flex:1;justify-content:center}

/* 환경 규칙 표시 — 단수가 오를수록 붉어진다 (§7-A.2) */
.hz{font-size:.78rem;color:var(--muted);margin:.25rem 0 .5rem;line-height:1.4}
.hz.t1{color:var(--ink-soft)}
.hz.t2{color:var(--gold)}
.hz.t3{color:var(--danger)}

/* ── 선택지 버튼 ─────────────────────────── */
.btn{
  border:1px solid var(--line);background:var(--panel-2);
  padding:.4rem .65rem;border-radius:2px;
  min-height:2.2rem;
  display:flex;align-items:center;gap:.45rem;
  transition:border-color .12s,background .12s;
  -webkit-tap-highlight-color:transparent;touch-action:manipulation;
  max-width:100%;
}
/* 좁은 화면에서는 선택지를 한 줄에 하나씩 — 글자가 잘리지 않는다 */
@media (max-width:560px){ .btn{width:100%} }
.btn:hover:not(:disabled){border-color:var(--accent-dim);background:var(--accent-bg)}
.btn:disabled{opacity:.36;cursor:not-allowed}
.btn .k{font-family:var(--mono);font-size:.7rem;color:var(--accent);min-width:.9em}
.btn .nm{font-weight:400}
.btn .meta{font-family:var(--mono);font-size:.72rem;color:var(--muted);margin-left:auto;padding-left:.5rem}
.btn.wide{width:100%}
.btn.ghost{background:none;border-color:var(--line-soft);color:var(--muted)}
.btn.ghost:hover:not(:disabled){color:var(--ink);border-color:var(--line)}
.btn.primary{border-color:var(--accent-dim);background:var(--accent-bg)}
.btn.danger:hover:not(:disabled){border-color:var(--danger);background:var(--danger-bg)}
.eff-up{color:var(--accent);font-family:var(--mono)}
.eff-down{color:var(--danger);font-family:var(--mono)}

/* ── 왼쪽 패널 공통 ──────────────────────── */
.pt{
  font-family:var(--mono);font-size:.7rem;letter-spacing:.14em;text-transform:uppercase;
  color:var(--muted);margin:0 0 .5rem;
}
.unit{margin-bottom:1.1rem}
.unit h3{
  font-family:var(--display);font-size:1.08rem;font-weight:700;margin:0 0 .25rem;
  display:flex;align-items:baseline;gap:.5rem;flex-wrap:wrap;
}
.tag{
  font-family:var(--mono);font-size:.66rem;padding:.06rem .34rem;
  border:1px solid currentColor;border-radius:2px;opacity:.85;
}
.bar{height:9px;background:var(--sunken);border:1px solid var(--line);position:relative;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent-dim);transition:width .3s}
.bar.foe i{background:var(--danger)}
.bar.small{height:6px}
.hpnum{font-family:var(--mono);font-size:.74rem;color:var(--muted);margin-top:.2rem}
.chips{display:flex;flex-wrap:wrap;gap:.3rem;margin-top:.35rem}
.chip{
  font-family:var(--mono);font-size:.68rem;padding:.08rem .38rem;
  border:1px solid var(--line);border-radius:2px;color:var(--ink-soft);background:var(--sunken);
}
.chip.warn{color:var(--danger);border-color:var(--danger)}
.chip.good{color:var(--accent);border-color:var(--accent-dim)}

.frames{display:grid;gap:.45rem}
.frame{padding:.2rem 0;border-bottom:1px solid var(--line-soft)}
.frame:last-child{border-bottom:0}
.frame.down{opacity:.5}
.frame-top{display:grid;grid-template-columns:2.7rem 1fr auto;gap:.6rem;align-items:baseline}
.frame-top .lb{font-family:var(--mono);font-size:.7rem;color:var(--muted)}
.frame-top .vl{min-width:0;overflow-wrap:anywhere}
.frame-top .rt{font-family:var(--mono);font-size:.72rem;color:var(--muted);white-space:nowrap}
.frame-top .rt.warn{color:var(--danger)}
.bar.tiny{height:4px;margin-top:.22rem}
.bar.tiny i{background:var(--accent-dim)}
.bar.tiny.low i{background:var(--danger)}
.downtag{font-family:var(--mono);font-size:.66rem;color:var(--danger);margin-top:.15rem}

.rows{display:grid;gap:.3rem}
.row{
  display:grid;grid-template-columns:2.7rem 1fr auto;gap:.6rem;align-items:baseline;
  padding:.3rem 0;border-bottom:1px solid var(--line-soft);
}
.row .lb{font-family:var(--mono);font-size:.7rem;color:var(--muted)}
.row .vl{min-width:0;overflow-wrap:anywhere}
.row .rt{font-family:var(--mono);font-size:.72rem;color:var(--muted);white-space:nowrap}
.row .rt.warn{color:var(--danger)}
.empty{color:var(--muted);font-style:italic}

.statgrid{
  display:grid;grid-template-columns:repeat(auto-fit,minmax(5.2rem,1fr));gap:.3rem .8rem;
  margin-top:.7rem;font-family:var(--mono);font-size:.76rem;
}
.statgrid span{color:var(--muted)}
.statgrid b{color:var(--ink);font-weight:500}

/* ── 미니맵 ──────────────────────────────── */
.map{--cell:min(2.2rem,7vmin);display:grid;gap:2px;justify-content:center;margin:.4rem 0 .8rem}
.cell{
  width:var(--cell);height:var(--cell);display:grid;place-items:center;
  border:1px solid transparent;font-size:calc(var(--cell) * .45);border-radius:2px;
}
.cell.room{background:var(--sunken);border-color:var(--line)}
/* 아직 안 가 본 방 — 갈 곳이 남았다는 신호라 가장 눈에 띄어야 한다 */
.cell.unseen{color:var(--accent);background:transparent;border-style:dashed;border-color:var(--accent-dim)}
/* 가 봤지만 아직 안 끝난 방 */
.cell.open{color:var(--ink);border-color:var(--ink-soft)}
/* 끝난 방 — 흐리게 물러난다 */
.cell.done{color:var(--muted);opacity:.5}
.cell.here{border-color:var(--accent);background:var(--accent-bg);box-shadow:0 0 0 1px var(--accent-dim)}

/* 지도 범례 */
.legend .lg{display:inline-flex;align-items:center;gap:.25rem}
.legend .sw{
  width:.62rem;height:.62rem;border:1px solid var(--line);border-radius:2px;
  background:var(--sunken);display:inline-block;
}
.legend .sw.unseen{background:transparent;border-style:dashed;border-color:var(--accent-dim)}
.legend .sw.open{border-color:var(--ink-soft)}
.legend .sw.done{opacity:.45}
.legend .sw.here{border-color:var(--accent);background:var(--accent-bg)}
.legend{
  font-family:var(--mono);font-size:.68rem;color:var(--muted);
  display:flex;flex-wrap:wrap;gap:.15rem .7rem;
}

/* ── 마을 ────────────────────────────────── */
.town{display:grid;gap:.5rem}
.bldg{
  border:1px solid var(--line);background:var(--sunken);
  padding:.6rem .75rem;border-radius:2px;
}
.bldg .n{font-family:var(--display);font-weight:700;font-size:1rem}
.bldg .s{font-family:var(--mono);font-size:.72rem;color:var(--accent-dim);margin-top:.1rem}

hr.sep{border:0;border-top:1px solid var(--line-soft);margin:.9rem 0}
.note{font-size:.82rem;color:var(--muted);margin-top:.5rem}
#left::-webkit-scrollbar,#log::-webkit-scrollbar,#choices::-webkit-scrollbar{width:8px}
#left::-webkit-scrollbar-thumb,#log::-webkit-scrollbar-thumb,#choices::-webkit-scrollbar-thumb{
  background:var(--line);border-radius:4px}
</style>
</head>
<body>
<div id="app">
  <div id="topbar"></div>
  <div id="dpad" hidden aria-label="이동">
  <button class="dp up" type="button" data-dir="위">↑</button>
  <button class="dp left" type="button" data-dir="왼쪽">←</button>
  <button class="dp right" type="button" data-dir="오른쪽">→</button>
  <button class="dp down" type="button" data-dir="아래">↓</button>
</div>
<div id="panes">
    <aside id="left"></aside>
    <button id="panetoggle" type="button" aria-expanded="true">상태 접기 ▲</button>
    <main id="right">
      <div id="log"></div>
    </main>
  </div>
  <div id="choices"></div>
  <div id="scalebox" hidden>
    <div class="row1"><span class="ttl">글자 크기</span><span id="scaleval">100%</span></div>
    <input id="scalerange" type="range" min="70" max="160" step="5" value="100" aria-label="글자 크기">
    <div class="preview">골렘이 발톱팔을 휘두른다.</div>
    <div class="acts">
      <button id="scalereset" type="button">기본값</button>
      <button id="scaleclose" type="button">닫기</button>
    </div>
  </div>
</div>
<script>
  // 글자 크기는 모듈 로딩 전에 적용해 첫 화면부터 어긋나지 않게 한다
  (function () {
    var KEY = 'patchwork.uiScale2';
    var pct = 100;
    try {
      var v = localStorage.getItem(KEY);
      if (v !== null) pct = Math.min(160, Math.max(70, +v || 100));
    } catch (e) {}

    function apply() {
      document.documentElement.style.setProperty('--ui-scale', pct / 100);
      var label = document.getElementById('uiscale');
      if (label) label.textContent = '가 ' + pct + '%';
      var val = document.getElementById('scaleval');
      if (val) val.textContent = pct + '%';
      var range = document.getElementById('scalerange');
      if (range && +range.value !== pct) range.value = pct;
    }
    function set(next, persist) {
      pct = Math.min(160, Math.max(70, next));
      apply();
      if (persist) { try { localStorage.setItem(KEY, pct); } catch (e) {} }
    }

    window.applyUiScale = apply;
    window.toggleUiScale = function () {
      var box = document.getElementById('scalebox');
      if (!box) return;
      box.hidden = !box.hidden;
      if (!box.hidden) apply();
    };

    document.addEventListener('DOMContentLoaded', function () {
      var range = document.getElementById('scalerange');
      var box = document.getElementById('scalebox');
      // 끄는 동안 바로바로 반영하고, 손을 뗄 때 저장한다
      range.addEventListener('input', function () { set(+range.value, false); });
      range.addEventListener('change', function () { set(+range.value, true); });
      document.getElementById('scalereset').addEventListener('click', function () { set(100, true); });
      document.getElementById('scaleclose').addEventListener('click', function () { box.hidden = true; });
      // 바깥을 누르면 닫힌다
      document.addEventListener('pointerdown', function (e) {
        if (box.hidden) return;
        if (box.contains(e.target) || e.target.closest('#uiscale')) return;
        box.hidden = true;
      });
      document.addEventListener('keydown', function (e) {
        if (e.key === 'Escape' && !box.hidden) box.hidden = true;
      });
      apply();
    });
    apply();
  })();
</script>
<script>
  // 상태 패널 접기 — 세로모드에서 로그를 넓게 보기 위한 것
  (function () {
    var KEY = 'patchwork.panesCollapsed';
    var off = false;
    try { off = localStorage.getItem(KEY) === '1'; } catch (e) {}
    function apply() {
      document.getElementById('app').classList.toggle('panes-collapsed', off);
      var b = document.getElementById('panetoggle');
      if (b) {
        b.textContent = off ? '상태 보기 ▼' : '상태 접기 ▲';
        b.setAttribute('aria-expanded', String(!off));
      }
    }
    document.addEventListener('DOMContentLoaded', function () {
      document.getElementById('panetoggle').addEventListener('click', function () {
        off = !off;
        try { localStorage.setItem(KEY, off ? '1' : '0'); } catch (e) {}
        apply();
      });
      apply();
    });
    apply();
  })();
</script>
<script type="module" src="src/main.js"></script>
</body>
</html>
