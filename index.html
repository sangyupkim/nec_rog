<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Project Patchwork</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ctext y='26' font-size='26'%3E%F0%9F%92%80%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --ground:#0F1009; --panel:#171A11; --panel-2:#1E2217; --sunken:#0A0B06;
  --ink:#E8E4D5; --ink-soft:#C3BEAA; --muted:#8B866E;
  --line:#2C3124; --line-soft:#222618;
  --accent:#A6C46C; --accent-dim:#6E8A42; --accent-bg:#1E2616;
  --danger:#D4825A; --danger-bg:#2B1A12;
  --gold:#D6B65C;
  --el-참격:#C9CDD4; --el-타격:#C79A6B; --el-화염:#E0794A; --el-냉기:#7FB6D8;
  --el-독:#9FBF5A; --el-부패:#8A9B57; --el-신성:#E6D99B;
  --display:"Gowun Batang","Nanum Myeongjo",Georgia,serif;
  --body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
*{box-sizing:border-box}
html,body{height:100%}
/*
 * rem의 기준을 뷰포트에 고정한다.
 * 이걸 안 하면 모바일 브라우저의 글꼴 크기 설정에 화면 전체가 끌려간다.
 * text-size-adjust는 안드로이드 크롬의 자동 글자 확대(text boosting)를 막는다.
 */
html{
  font-size:calc(clamp(12px, 2.6vmin, 16px) * var(--ui-scale, 1));
  -webkit-text-size-adjust:100%;
  text-size-adjust:100%;
}
body{
  margin:0;background:var(--ground);color:var(--ink);
  font-family:var(--body);font-weight:350;font-size:1rem;line-height:1.55;
  -webkit-font-smoothing:antialiased;overflow:hidden;
  overscroll-behavior:none;
}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* ── 전체 틀 ─────────────────────────────── */
#app{
  height:100dvh;display:grid;
  grid-template-rows:auto minmax(0,1fr) auto;   /* 상단바 · 본문 · 선택지 */
  max-width:1400px;margin:0 auto;
}
/* 좁은 화면에서도 한 줄을 유지한다. 넘치면 가로로 밀린다 */
#topbar{
  display:flex;flex-wrap:nowrap;gap:0 .9rem;align-items:baseline;
  padding:.4rem clamp(8px,1.6vw,18px);
  border-bottom:1px solid var(--line);background:var(--panel);
  font-family:var(--mono);font-size:.74rem;color:var(--muted);
  overflow-x:auto;scrollbar-width:none;white-space:nowrap;
}
#topbar::-webkit-scrollbar{display:none}
#topbar span{flex:0 0 auto}
#uiscale{
  flex:0 0 auto;font-family:var(--mono);font-size:.74rem;color:var(--muted);
  border:1px solid var(--line);border-radius:2px;padding:.1rem .4rem;margin-left:.2rem;
  -webkit-tap-highlight-color:transparent;touch-action:manipulation;
}
#uiscale:hover{color:var(--ink);border-color:var(--accent-dim)}
#topbar .where{color:var(--accent);letter-spacing:.06em}
#topbar .sp{flex:1}
#topbar b{color:var(--ink-soft);font-weight:500}

#panes{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);min-height:0}

/* 세로 비율이거나 너무 좁으면 위아래로 쌓는다 (§12.2) */
@media (max-aspect-ratio:4/5), (max-width:560px){
  #panes{grid-template-columns:1fr;grid-template-rows:minmax(0,auto) minmax(0,1fr)}
  #left{max-height:34dvh;border-right:0;border-bottom:1px solid var(--line)}
}

/* 가로모드 휴대폰 — 높이가 모자라므로 세로 여백을 걷어낸다 */
@media (orientation:landscape) and (max-height:520px){
  #topbar{padding-block:.25rem}
  #left,#log{padding-block:.5rem}
  #choices{max-height:52dvh;padding:.4rem clamp(6px,1.2vw,12px);gap:.3rem}
  .btn{padding:.34rem .55rem}
  .line{line-height:1.45}
  .unit{margin-bottom:.7rem}
  hr.sep{margin:.6rem 0}
  section,.map{margin-block:.3rem}
}

#left{
  border-right:1px solid var(--line);overflow-y:auto;
  padding:clamp(10px,2vw,18px);background:var(--panel);
}
#right{display:grid;min-height:0}
/* 오른쪽은 순수 텍스트 영역 — 로그만 있다 */
#log{
  overflow-y:auto;padding:clamp(10px,2vw,18px);
  display:flex;flex-direction:column;gap:.24rem;
}
#choices{
  border-top:1px solid var(--line);background:var(--panel);
  padding:clamp(6px,1.4vw,14px);
  padding-bottom:max(clamp(6px,1.4vw,14px), env(safe-area-inset-bottom));
  display:flex;flex-wrap:wrap;gap:.4rem;align-content:flex-start;
  max-height:46dvh;overflow-y:auto;
}

/* ── 로그 ────────────────────────────────── */
.line{animation:fade .28s ease both}
@keyframes fade{from{opacity:0;transform:translateY(3px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.line{animation:none}}
.line.golem{color:var(--ink)}
.line.enemy{color:var(--ink-soft)}
.line.good{color:var(--accent)}
.line.bad{color:var(--danger)}
.line.necro{color:var(--gold)}
.line.dim{color:var(--muted)}
.line.narrate{color:var(--ink-soft);font-family:var(--display);font-size:1.02rem;margin:.4rem 0}
.line.head{
  font-family:var(--mono);font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;
  color:var(--accent);margin-top:1rem;padding-top:.5rem;border-top:1px solid var(--line-soft);
}
.line::before{content:"› ";color:var(--muted)}
.line.narrate::before,.line.head::before{content:""}

/* ── 선택지 버튼 ─────────────────────────── */
.btn{
  border:1px solid var(--line);background:var(--panel-2);
  padding:.4rem .65rem;border-radius:2px;
  min-height:2.2rem;
  display:flex;align-items:center;gap:.45rem;
  transition:border-color .12s,background .12s;
  -webkit-tap-highlight-color:transparent;touch-action:manipulation;
  max-width:100%;
}
/* 좁은 화면에서는 선택지를 한 줄에 하나씩 — 글자가 잘리지 않는다 */
@media (max-width:560px){ .btn{width:100%} }
.btn:hover:not(:disabled){border-color:var(--accent-dim);background:var(--accent-bg)}
.btn:disabled{opacity:.36;cursor:not-allowed}
.btn .k{font-family:var(--mono);font-size:.7rem;color:var(--accent);min-width:.9em}
.btn .nm{font-weight:400}
.btn .meta{font-family:var(--mono);font-size:.72rem;color:var(--muted);margin-left:auto;padding-left:.5rem}
.btn.wide{width:100%}
.btn.ghost{background:none;border-color:var(--line-soft);color:var(--muted)}
.btn.ghost:hover:not(:disabled){color:var(--ink);border-color:var(--line)}
.btn.primary{border-color:var(--accent-dim);background:var(--accent-bg)}
.btn.danger:hover:not(:disabled){border-color:var(--danger);background:var(--danger-bg)}
.eff-up{color:var(--accent);font-family:var(--mono)}
.eff-down{color:var(--danger);font-family:var(--mono)}

/* ── 왼쪽 패널 공통 ──────────────────────── */
.pt{
  font-family:var(--mono);font-size:.7rem;letter-spacing:.14em;text-transform:uppercase;
  color:var(--muted);margin:0 0 .5rem;
}
.unit{margin-bottom:1.1rem}
.unit h3{
  font-family:var(--display);font-size:1.08rem;font-weight:700;margin:0 0 .25rem;
  display:flex;align-items:baseline;gap:.5rem;flex-wrap:wrap;
}
.tag{
  font-family:var(--mono);font-size:.66rem;padding:.06rem .34rem;
  border:1px solid currentColor;border-radius:2px;opacity:.85;
}
.bar{height:9px;background:var(--sunken);border:1px solid var(--line);position:relative;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent-dim);transition:width .3s}
.bar.foe i{background:var(--danger)}
.bar.small{height:6px}
.hpnum{font-family:var(--mono);font-size:.74rem;color:var(--muted);margin-top:.2rem}
.chips{display:flex;flex-wrap:wrap;gap:.3rem;margin-top:.35rem}
.chip{
  font-family:var(--mono);font-size:.68rem;padding:.08rem .38rem;
  border:1px solid var(--line);border-radius:2px;color:var(--ink-soft);background:var(--sunken);
}
.chip.warn{color:var(--danger);border-color:var(--danger)}
.chip.good{color:var(--accent);border-color:var(--accent-dim)}

.frames{display:grid;gap:.45rem}
.frame{padding:.2rem 0;border-bottom:1px solid var(--line-soft)}
.frame:last-child{border-bottom:0}
.frame.down{opacity:.5}
.frame-top{display:grid;grid-template-columns:2.7rem 1fr auto;gap:.6rem;align-items:baseline}
.frame-top .lb{font-family:var(--mono);font-size:.7rem;color:var(--muted)}
.frame-top .vl{min-width:0;overflow-wrap:anywhere}
.frame-top .rt{font-family:var(--mono);font-size:.72rem;color:var(--muted);white-space:nowrap}
.frame-top .rt.warn{color:var(--danger)}
.bar.tiny{height:4px;margin-top:.22rem}
.bar.tiny i{background:var(--accent-dim)}
.bar.tiny.low i{background:var(--danger)}
.downtag{font-family:var(--mono);font-size:.66rem;color:var(--danger);margin-top:.15rem}

.rows{display:grid;gap:.3rem}
.row{
  display:grid;grid-template-columns:2.7rem 1fr auto;gap:.6rem;align-items:baseline;
  padding:.3rem 0;border-bottom:1px solid var(--line-soft);
}
.row .lb{font-family:var(--mono);font-size:.7rem;color:var(--muted)}
.row .vl{min-width:0;overflow-wrap:anywhere}
.row .rt{font-family:var(--mono);font-size:.72rem;color:var(--muted);white-space:nowrap}
.row .rt.warn{color:var(--danger)}
.empty{color:var(--muted);font-style:italic}

.statgrid{
  display:grid;grid-template-columns:repeat(auto-fit,minmax(5.2rem,1fr));gap:.3rem .8rem;
  margin-top:.7rem;font-family:var(--mono);font-size:.76rem;
}
.statgrid span{color:var(--muted)}
.statgrid b{color:var(--ink);font-weight:500}

/* ── 미니맵 ──────────────────────────────── */
.map{--cell:min(2.2rem,7vmin);display:grid;gap:2px;justify-content:center;margin:.4rem 0 .8rem}
.cell{
  width:var(--cell);height:var(--cell);display:grid;place-items:center;
  border:1px solid transparent;font-size:calc(var(--cell) * .45);border-radius:2px;
}
.cell.room{background:var(--sunken);border-color:var(--line)}
.cell.seen{color:var(--muted);background:transparent;border-style:dashed}
.cell.done{color:var(--muted)}
.cell.here{border-color:var(--accent);background:var(--accent-bg);box-shadow:0 0 0 1px var(--accent-dim)}
.legend{font-family:var(--mono);font-size:.7rem;color:var(--muted);display:grid;gap:.15rem}

/* ── 마을 ────────────────────────────────── */
.town{display:grid;gap:.5rem}
.bldg{
  border:1px solid var(--line);background:var(--sunken);
  padding:.6rem .75rem;border-radius:2px;
}
.bldg .n{font-family:var(--display);font-weight:700;font-size:1rem}
.bldg .s{font-family:var(--mono);font-size:.72rem;color:var(--accent-dim);margin-top:.1rem}

hr.sep{border:0;border-top:1px solid var(--line-soft);margin:.9rem 0}
.note{font-size:.82rem;color:var(--muted);margin-top:.5rem}
#left::-webkit-scrollbar,#log::-webkit-scrollbar,#choices::-webkit-scrollbar{width:8px}
#left::-webkit-scrollbar-thumb,#log::-webkit-scrollbar-thumb,#choices::-webkit-scrollbar-thumb{
  background:var(--line);border-radius:4px}
</style>
</head>
<body>
<div id="app">
  <div id="topbar"></div>
  <div id="panes">
    <aside id="left"></aside>
    <main id="right">
      <div id="log"></div>
    </main>
  </div>
  <div id="choices"></div>
</div>
<script>
  // 글자 크기는 모듈 로딩 전에 적용해 첫 화면부터 어긋나지 않게 한다
  (function () {
    var SC = [0.8, 0.9, 1, 1.15, 1.35];
    var i = 2;
    try { var v = localStorage.getItem('patchwork.uiScale'); if (v !== null) i = Math.min(SC.length - 1, Math.max(0, +v)); } catch (e) {}
    function apply() {
      document.documentElement.style.setProperty('--ui-scale', SC[i]);
      var b = document.getElementById('uiscale');
      if (b) b.textContent = '가' + Math.round(SC[i] * 100) + '%';
    }
    window.cycleUiScale = function () {
      i = (i + 1) % SC.length;
      try { localStorage.setItem('patchwork.uiScale', i); } catch (e) {}
      apply();
    };
    window.applyUiScale = apply;
    apply();
  })();
</script>
<script type="module" src="src/main.js"></script>
</body>
</html>
